name: Backend CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crisisconnect
          POSTGRES_PASSWORD: crisisconnect
          POSTGRES_DB: crisisconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crisisconnect -d crisisconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://crisisconnect:crisisconnect@localhost:5432/crisisconnect_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Verify database migration
        run: alembic current

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: docker build -t crisisconnect-backend:${{ github.sha }} .
