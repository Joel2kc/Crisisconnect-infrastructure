{% extends "base.html" %}

{% block content %}
<p>Hi {{ full_name }},</p>

<p>We received a request to reset your password. Use the OTP below to complete the process:</p>

<div style="background-color:#F1EFE8; padding:16px; border-radius:6px; text-align:center; margin:16px 0;">
  <span style="font-size:28px; font-weight:bold; letter-spacing:6px; color:#0C447C;">{{ otp }}</span>
</div>

<p>This code will expire shortly. If you did not request a password reset, you can safely ignore this email.</p>
{% endblock %}
